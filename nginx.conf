server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Habilitar CORS para Module Federation (Permite que el Shell de Nataly descargue remoteEntry.js)
    location / {
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS';
        add_header Access-Control-Allow-Headers 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
        
        try_files $uri $uri/ /index.html;
    }

    # Caché optimizada para assets compilados
    location /assets/ {
        add_header Access-Control-Allow-Origin *;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Health check para orquestadores Docker
    location /health {
        access_log off;
        return 200 '{"servicio":"mfe3_inventario_frontend","estado":"OPERATIVO"}';
        add_header Content-Type application/json;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
